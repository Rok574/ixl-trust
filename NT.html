<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>IXL | Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0a0a0a;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .clock {
      font-size: 4rem;
      font-weight: 600;
      letter-spacing: -2px;
      margin-bottom: 8px;
      color: #ffffff;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
    }

    .date {
      font-size: 14px;
      color: #71717a;
      margin-bottom: 32px;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.4);
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f0f0f;
      border: 1px solid #1f1f1f;
      border-radius: 12px;
      padding: 12px 16px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 40px;
    }

    .search-box i {
      color: #71717a;
      font-size: 14px;
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e4e4e7;
      font-size: 14px;
      font-family: inherit;
    }

    .search-box input::placeholder {
      color: #52525b;
    }

    .search-box select {
      background: #1a1a1a;
      border: none;
      border-radius: 6px;
      color: #71717a;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }

    .shortcuts {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      max-width: 500px;
      width: 100%;
    }

    .page-controls {
      position: fixed;
      top: 64px;
      right: 18px;
      min-width: 220px;
      padding: 10px;
      background: rgba(15, 15, 15, 0.86);
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(12px);
      z-index: 2;
    }

    .page-controls.is-hidden {
      display: none;
    }

    #appearanceToggle {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 38px;
      height: 38px;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      background: rgba(15, 15, 15, 0.9);
      color: #a1a1aa;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(12px);
      z-index: 3;
    }

    #appearanceToggle:hover,
    #appearanceToggle[aria-expanded="true"] {
      border-color: #52525b;
      color: #e4e4e7;
      background: #1a1a1a;
    }

    .appearance-heading {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0 2px 8px;
      color: #e4e4e7;
      font-size: 12px;
      font-weight: 600;
    }

    .appearance-heading i {
      color: #8b5cf6;
      font-size: 11px;
    }

    .appearance-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .appearance-actions button,
    .color-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 32px;
      padding: 0 9px;
      background: #0f0f0f;
      border: 1px solid #2a2a2a;
      border-radius: 7px;
      color: #e4e4e7;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }

    .color-control {
      justify-content: flex-start;
      grid-column: 1 / -1;
      color: #a1a1aa;
    }

    .color-control input {
      width: 25px;
      height: 22px;
      margin-left: auto;
      padding: 2px;
      border: 1px solid #3f3f46;
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
    }

    .appearance-actions button:hover,
    .color-control:hover {
      background: #1a1a1a;
      border-color: #52525b;
    }

    .appearance-actions button i {
      color: #a1a1aa;
    }

    @media (max-width: 600px) {
      #appearanceToggle {
        top: 12px;
        right: 12px;
      }

      .page-controls {
        top: 58px;
        right: 12px;
        min-width: 196px;
      }
    }

    .shortcut {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      cursor: pointer;
    }

    .shortcut-icon {
      width: 52px;
      height: 52px;
      background: #0f0f0f;
      border: 1px solid #1f1f1f;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .shortcut:hover .shortcut-icon {
      background: #1a1a1a;
      transform: translateY(-2px);
    }

    .shortcut-icon img {
      width: 22px;
      height: 22px;
      filter: brightness(0) invert(0.7);
    }

    .shortcut-icon i {
      font-size: 20px;
      color: #71717a;
    }

    .shortcut-label {
      font-size: 11px;
      color: #71717a;
      text-align: center;
      max-width: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
    }

    .shortcut:hover .shortcut-label {
      color: #e4e4e7;
    }

    .shortcut-remove {
      position: absolute;
      top: -5px;
      right: 8px;
      width: 18px;
      height: 18px;
      padding: 0;
      border: 1px solid #2a2a2a;
      border-radius: 50%;
      background: #0f0f0f;
      color: #71717a;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .shortcut:hover .shortcut-remove,
    .shortcut-remove:focus {
      opacity: 1;
    }

    .shortcut-remove:hover {
      color: #ef4444;
    }

    .quote {
      position: fixed;
      bottom: 24px;
      font-size: 13px;
      color: #52525b;
      max-width: 400px;
      text-align: center;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
    }

    .loader {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .loader.show {
      display: flex;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid #1f1f1f;
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="loader" id="loader">
    <div class="spinner"></div>
  </div>

  <button id="appearanceToggle" type="button" aria-expanded="false" aria-controls="appearancePanel" title="Open appearance settings">
    <i class="fa-solid fa-wand-magic-sparkles"></i>
  </button>

  <div class="page-controls is-hidden" id="appearancePanel" aria-label="New tab appearance">
    <div class="appearance-heading"><i class="fa-solid fa-wand-magic-sparkles"></i><span>Appearance</span></div>
    <div class="appearance-actions">
      <label class="color-control">Background color<input id="backgroundColor" type="color" value="#0a0a0a" title="Change background color"></label>
      <button id="backgroundImage" type="button" title="Set a background image"><i class="fa-regular fa-image"></i><span>Image</span></button>
      <button id="resetBackground" type="button" title="Reset the background"><i class="fa-solid fa-rotate-left"></i><span>Reset</span></button>
      <input id="backgroundFile" type="file" accept="image/*" hidden>
    </div>
  </div>

  <div class="clock" id="clock">00:00</div>
  <div class="date" id="date"></div>

  <form class="search-box" id="searchForm">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" id="searchInput" placeholder="Search the web..." autocomplete="off">
    <select id="engine">
      <option value="https://search.brave.com/search?q=">Brave</option>
      <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
      <option value="https://www.bing.com/search?q=">Bing</option>
      <option value="https://www.qwant.com/?q=">Qwant</option>
    </select>
  </form>

  <div class="shortcuts" id="shortcuts">
    <div class="shortcut" id="addShortcut">
      <div class="shortcut-icon"><i class="fa-solid fa-plus"></i></div>
      <span class="shortcut-label">Add</span>
    </div>
  </div>

  <div class="quote" id="quote"></div>

  <script>
    const $ = s => document.querySelector(s);
    const appearanceToggle = $('#appearanceToggle');
    const appearancePanel = $('#appearancePanel');
    const setAppearanceOpen = open => {
      appearancePanel.classList.toggle('is-hidden', !open);
      appearanceToggle.setAttribute('aria-expanded', String(open));
      appearanceToggle.title = open ? 'Close appearance settings' : 'Open appearance settings';
    };
    appearanceToggle.onclick = () => setAppearanceOpen(appearancePanel.classList.contains('is-hidden'));
    document.addEventListener('click', e => {
      if (!appearancePanel.contains(e.target) && !appearanceToggle.contains(e.target) && !appearancePanel.classList.contains('is-hidden')) {
        setAppearanceOpen(false);
      }
    });

    const nav = url => {
      // When framed inside the proxy browser, ask the parent to navigate the
      // active Scramjet tab. When opened standalone, navigate directly.
      try {
        if (window.parent && window.parent !== window) {
          $('#loader').classList.add('show');
          window.parent.postMessage({ type: 'navigate', url }, '*');
          return;
        }
      } catch {}
      window.location.href = url;
    };

    // Clock
function updateClock() {
  const now = new Date();

  $('#clock').textContent = now.toLocaleTimeString('en-US', {
    hour: '2-digit', 
    minute: '2-digit',
    hour12: true
  });

  $('#date').textContent = now.toLocaleDateString('en-US', {
    weekday: 'long',
    month: 'long',
    day: 'numeric'
  });
}

updateClock();
setInterval(updateClock, 1000);

    // Search
    const ENGINES = {
      brave: "https://search.brave.com/search?q=",
      duckduckgo: "https://duckduckgo.com/?q=",
      google: "https://www.google.com/search?q=",
      bing: "https://www.bing.com/search?q=",
      qwant: "https://www.qwant.com/?q=",
    };
    try {
      const saved = JSON.parse(localStorage.getItem("searchEngine") || '"brave"');
      if (ENGINES[saved]) $('#engine').value = ENGINES[saved];
    } catch {}
    $('#searchForm').onsubmit = e => {
      e.preventDefault();
      const q = $('#searchInput').value.trim();
      if (q) nav($('#engine').value + encodeURIComponent(q));
    };

    // New-tab appearance
    const backgroundColor = $('#backgroundColor');
    const backgroundFile = $('#backgroundFile');
    const savedBackgroundColor = localStorage.getItem('newTabBackgroundColor') || '#0a0a0a';
    const savedBackgroundImage = localStorage.getItem('newTabBackgroundImage') || '';
    backgroundColor.value = savedBackgroundColor;
    document.body.style.backgroundColor = savedBackgroundColor;
    const applyBackgroundImage = image => {
      const safeImage = image.replace(/["\\)]/g, '\\$&');
      document.body.style.backgroundImage = image ? `url(${safeImage})` : 'none';
    };
    applyBackgroundImage(savedBackgroundImage);
    backgroundColor.oninput = () => {
      localStorage.setItem('newTabBackgroundColor', backgroundColor.value);
      document.body.style.backgroundColor = backgroundColor.value;
    };
    $('#backgroundImage').onclick = () => backgroundFile.click();
    backgroundFile.onchange = () => {
      const file = backgroundFile.files?.[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        alert('Please choose an image file.');
        backgroundFile.value = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        const image = String(reader.result || '');
        try {
          localStorage.setItem('newTabBackgroundImage', image);
          applyBackgroundImage(image);
        } catch {
          alert('That image is too large to save. Please choose a smaller image.');
        }
        backgroundFile.value = '';
      };
      reader.readAsDataURL(file);
    };
    $('#resetBackground').onclick = () => {
      localStorage.removeItem('newTabBackgroundColor');
      localStorage.removeItem('newTabBackgroundImage');
      backgroundColor.value = '#0a0a0a';
      document.body.style.backgroundColor = '#0a0a0a';
      applyBackgroundImage('');
    };

    // Shortcuts. The first load migrates the old custom-only list, then the
    // complete list is persisted so built-in shortcuts can be removed too.
    const DEFAULT_SHORTCUTS = [
      ['YouTube', 'https://youtube.com', 'youtube'],
      ['GitHub', 'https://github.com', 'github'],
      ['Discord', 'https://discord.com', 'discord'],
      ['Twitter', 'https://x.com', 'x'],
      ['Reddit', 'https://reddit-viewer.com', 'reddit'],
      ['Spotify', 'https://spotify.com', 'spotify'],
      ['Netflix', 'https://netflix.com', 'netflix'],
      ['Twitch', 'https://twitch.tv', 'twitch'],
      ['Gmail', 'https://mail.google.com', 'gmail'],
    ].map(([name, url, icon]) => ({ name, url, icon }));

    function getShortcuts() {
      try {
        if (localStorage.getItem('newTabShortcuts') === null) {
          const oldCustom = JSON.parse(localStorage.getItem('shortcuts') || '[]');
          const initial = DEFAULT_SHORTCUTS.concat(Array.isArray(oldCustom) ? oldCustom : []);
          localStorage.setItem('newTabShortcuts', JSON.stringify(initial));
          return initial;
        }
        const stored = JSON.parse(localStorage.getItem('newTabShortcuts') || '[]');
        return Array.isArray(stored) ? stored : [];
      } catch {
        return [];
      }
    }

    function renderShortcuts() {
      const container = $('#shortcuts');
      const addBtn = $('#addShortcut');
      container.querySelectorAll('.saved-shortcut').forEach(e => e.remove());
      getShortcuts().forEach((shortcut, index) => {
        const div = document.createElement('div');
        div.className = 'shortcut saved-shortcut';
        div.dataset.url = shortcut.url;
        div.dataset.index = index;
        const icon = document.createElement('div');
        icon.className = 'shortcut-icon';
        if (shortcut.icon) {
          const image = document.createElement('img');
          image.src = `https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/${shortcut.icon}.svg`;
          image.alt = '';
          icon.appendChild(image);
        } else {
          icon.innerHTML = '<i class="fa-solid fa-link"></i>';
        }
        const label = document.createElement('span');
        label.className = 'shortcut-label';
        label.textContent = shortcut.name || shortcut.url;
        const remove = document.createElement('button');
        remove.className = 'shortcut-remove';
        remove.type = 'button';
        remove.title = `Remove ${shortcut.name || shortcut.url}`;
        remove.setAttribute('aria-label', `Remove ${shortcut.name || shortcut.url}`);
        remove.textContent = '×';
        div.append(icon, label, remove);
        addBtn.before(div);
      });
    }

    $('#shortcuts').onclick = e => {
      const remove = e.target.closest('.shortcut-remove');
      const shortcut = e.target.closest('.saved-shortcut');
      const addBtn = e.target.closest('#addShortcut');

      if (remove && shortcut) {
        e.stopPropagation();
        const shortcuts = getShortcuts();
        shortcuts.splice(Number(shortcut.dataset.index), 1);
        localStorage.setItem('newTabShortcuts', JSON.stringify(shortcuts));
        renderShortcuts();
      } else if (shortcut) {
        nav(shortcut.dataset.url);
      } else if (addBtn) {
        const name = prompt('Shortcut name:');
        if (!name) return;
        let url = prompt('URL:');
        if (!url) return;
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        const shortcuts = getShortcuts();
        shortcuts.push({ name: name.trim(), url: url.trim() });
        localStorage.setItem('newTabShortcuts', JSON.stringify(shortcuts));
        renderShortcuts();
      }
    };

    // Quote
    const quotes = [
    "so tuff",
    "it is what it is",
    "do ur work",
    "this is what happens when u dont touch grass",
    "FULL BOX",
    "FULL PIECE",
    "200!",
    "press esc + refresh + power button for hacks",
    "press ctrl+x to hide your screen",
    "change the tab title and favicon in settings",
    "TEACHERR!",
    "lebron lebron lebronn james",
    "lebron is OUR goat"
];
    $('#quote').textContent = quotes[Math.floor(Math.random() * quotes.length)];

    renderShortcuts();
  </script>
</body>

</html>
